apiVersion: apps/v1
kind: Deployment
metadata: {name: products, namespace: morays}
spec:
  replicas: 1
  selector: {matchLabels: {app: products}}
  template:
    metadata: {labels: {app: products}}
    spec:
      containers:
      - name: products
        image: PRODUCTS_IMAGE_PLACEHOLDER
        ports: [{containerPort: 5000}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 256Mi}
        readinessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: products, namespace: morays}
spec:
  type: ClusterIP
  selector: {app: products}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: morays}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
      - name: orders
        image: ORDERS_IMAGE_PLACEHOLDER
        ports: [{containerPort: 5000}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 256Mi}
        readinessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: morays}
spec:
  type: ClusterIP
  selector: {app: orders}
  ports: [{port: 5000, targetPort: 5000}]
